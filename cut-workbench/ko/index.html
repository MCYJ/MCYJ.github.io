<main><div class="intro with-preview"><div><h1>자르기 전에 배치를 확인하세요</h1><p>보유한 판재와 부품으로 사각 재단을 계획하고 절단 순서와 진행 상황을 한곳에서 확인하세요.</p></div><figure aria-label="사각 부품 여섯 개를 배치한 예시"><div class="sheet" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div><figcaption>1,200 × 600 mm</figcaption></figure></div><div class="details"><section><h2>치수를 입력해 재단표 만들기</h2><p>판재와 부품을 입력하거나 부품 CSV를 가져오세요. 배치를 계획하기 전에 톱날 폭과 가장자리 여유, 결 방향을 지정할 수 있습니다.</p></section><section><h2>배치와 미배치 확인하기</h2><p>배치 결과와 남은 부품을 확인하고 순서대로 절단을 표시하세요. 기기에서 A4 보고서를 공유할 수 있습니다.</p></section></div></main>
