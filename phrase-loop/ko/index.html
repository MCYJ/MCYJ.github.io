<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Phrase Loop</title>
  <link rel="stylesheet" href="/phrase-loop/style.css">
</head>
<body>
  <header class="masthead">
    <a class="wordmark" href="/phrase-loop/ko/">Phrase Loop</a>
    <nav><a href="/phrase-loop/ko/" aria-current="page">소개</a> <a href="/phrase-loop/ko/support/">지원</a> <a href="/phrase-loop/ko/privacy/">개인정보</a> <a href="/phrase-loop/" lang="en" hreflang="en">English</a></nav>
  </header>
<main class="product">
  <div class="opening">
    <section>
      <h1>한 구절을 듣고 따라 해 보세요</h1>
      <p>Phrase Loop는 iPhone과 iPad용으로 개발 중입니다. 기기에 있는 WAV 파일에서 A와 B 지점을 정하고, 그 사이를 짧게 반복해서 들으며 연습하도록 설계했습니다.</p>
    </section>
    <div class="signal" role="img" aria-label="A와 B로 반복 구간의 시작과 끝을 표시한 파형 도식">
      <div class="signal-points" aria-hidden="true"><span>A</span><span>B</span></div>
      <div class="trace" aria-hidden="true">
        <div class="bars outside"><i style="--height:18%"></i><i style="--height:29%"></i><i style="--height:42%"></i><i style="--height:36%"></i><i style="--height:22%"></i><i style="--height:31%"></i><i style="--height:20%"></i></div>
        <div class="bars selected"><i style="--height:28%"></i><i style="--height:43%"></i><i style="--height:71%"></i><i style="--height:56%"></i><i style="--height:33%"></i><i style="--height:69%"></i><i style="--height:91%"></i><i style="--height:62%"></i><i style="--height:78%"></i><i style="--height:53%"></i><i style="--height:32%"></i><i style="--height:49%"></i><i style="--height:86%"></i><i style="--height:65%"></i><i style="--height:44%"></i><i style="--height:28%"></i><i style="--height:39%"></i><i style="--height:23%"></i></div>
        <div class="bars outside"><i style="--height:34%"></i><i style="--height:52%"></i><i style="--height:39%"></i><i style="--height:26%"></i><i style="--height:36%"></i><i style="--height:21%"></i><i style="--height:14%"></i></div>
      </div>
    </div>
  </div>
  <section class="practice">
    <h2>내 녹음을 원음과 번갈아 듣기</h2>
    <p>0.8배속은 음의 높이를 유지하면서 원음을 느리게 재생하는 것을 목표로 합니다. 마이크 권한을 허용하면 직접 녹음한 뒤 원음과 내 녹음을 번갈아 들으며 비교할 수 있도록 개발하고 있습니다.</p>
  </section>
</main>
  <footer>RushLabs</footer>
</body>
</html>
