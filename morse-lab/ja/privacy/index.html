    <h1>Morse Lab プライバシーポリシー</h1>
    <p>Morse Lab は端末内で音を生成し、マイクを使用しません。ガイドの表示設定と聞き取り練習の回答数を、端末内のアプリ設定に保存します。</p>
    <p>アカウントは不要です。練習データは RushLabs に送信されません。広告やアクセス解析は使用しません。聞き取り練習画面から回答数を消去できます。端末の設定によっては、Apple がアプリ設定をバックアップする場合があります。</p>
    <p>お問い合わせ <a href="mailto:june1012june@gmail.com">june1012june@gmail.com</a></p>
