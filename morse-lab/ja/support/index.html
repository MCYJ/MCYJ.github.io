    <h1>Morse Lab サポート</h1>
    <p>見本の音を聴き、リズムに合わせて画面を押して、符号と間隔の長さを比べます。聞き取り練習では、再生が終わったら対応する文字や数字を選びます。</p>
    <p>聞き取り記録を消すには、聞き取り練習で「聞き取り記録を消去」を選び、確認します。お問い合わせの際は、端末の機種、iOS のバージョン、問題が起きるまでの手順をお知らせください。</p>
