<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Comic Spread Reader</title>
  <link rel="stylesheet" href="/comic-spread-reader/style.css">
</head>
<body>
  <header class="masthead">
    <a class="wordmark" href="/comic-spread-reader/ko/">Comic Spread Reader</a>
    <nav><a href="/comic-spread-reader/ko/" aria-current="page">리더</a> <a href="/comic-spread-reader/ko/support/">지원</a> <a href="/comic-spread-reader/ko/privacy/">개인정보</a> <a href="/comic-spread-reader/" lang="en" hreflang="en">English</a></nav>
  </header>
<main class="reader">
  <div class="opening">
    <div>
      <h1>내 만화를 한 장씩</h1>
      <p class="intro">Comic Spread Reader는 iPhone과 iPad용으로 개발 중입니다. 가지고 있는 CBZ 파일을 한 페이지씩 보거나 두 페이지를 펼쳐 보고, 마지막으로 읽은 위치를 기억하도록 설계했습니다.</p>
    </div>
    <div class="layout-diagram" role="img" aria-label="한 페이지와 두 페이지 펼침을 나타낸 도식">
      <div class="folio single"><span></span><span></span><span></span></div>
      <div class="spread">
        <div class="folio"><span></span><span></span><span></span></div>
        <div class="folio"><span></span><span></span><span></span></div>
      </div>
    </div>
  </div>
  <section class="reading">
    <h2>만화에 맞춰 읽기 방향 선택</h2>
    <p>원본의 순서에 맞게 왼쪽에서 오른쪽 또는 오른쪽에서 왼쪽으로 읽는 방향을 고르세요. 본문을 두 페이지씩 펼쳐도 표지는 한 페이지로 볼 수 있습니다.</p>
  </section>
</main>
  <footer>RushLabs</footer>
</body>
</html>
