<main><h1>フィールドレコード · サポート</h1>
<p>現場を作成し、見つけた不具合のタイトルと場所を入力します。必要に応じてメモや「ファイル」から選んだ写真を追加してください。同じ不具合の記録を開くと、対応や再訪時の状況を追記できます。</p>
<p>一度購入すると、不具合の履歴をPDFで共有できます。共有先はシステムの共有画面で選択します。</p>
<p>問題を報告する際は、アプリとiOSのバージョン、問題が起きるまでの操作をお知らせください。現場名や写真に個人情報が含まれる場合は、送信前に取り除いてください。</p>
<p><a href="mailto:june1012june@gmail.com">RushLabsへのお問い合わせ</a></p></main>
