<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="referrer" content="no-referrer">
  <title>앱 포트폴리오 · 진행현황</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip" href="#results">진행현황으로 건너뛰기</a>
  <main>
    <header><p class="eyebrow">APP PORTFOLIO</p><h1>앱 진행현황</h1></header>
    <section class="toolbar" aria-label="보기 및 필터">
      <div class="top-controls"><fieldset><legend>보기</legend><div class="segmented"><button type="button" id="table-button" aria-pressed="true">표</button><button type="button" id="board-button" aria-pressed="false">칸반</button></div></fieldset><label>작업 구분<select id="cycle"><option value="initial">초기 출시</option><option value="update">현재 개선판</option></select></label></div>
      <div class="filters"><label class="search">앱 검색<input id="search" type="search" placeholder="앱 이름으로 검색" autocomplete="off"></label><label>미션<select id="mission"><option value="all">모든 미션</option></select></label><label>플랫폼<select id="platform"><option value="all">모든 플랫폼</option><option value="ios">iOS</option><option value="android">Android</option></select></label><button type="button" id="reset" aria-label="필터 초기화">필터 초기화</button></div>
    </section>
    <div class="result-heading"><h2 id="cycle-heading">초기 출시</h2><p id="count" role="status" aria-live="polite"></p></div>
    <details class="legend"><summary role="button" aria-label="상태 기호 범례" aria-expanded="false">기호</summary><div id="legend-items"></div><p>i · iOS　a · Android　≋ · 세부 상태</p></details>
    <section id="results" tabindex="-1" aria-label="앱 진행현황"></section>

  </main>
</body>
</html>
