<main><h1>사진 공유정보 정리 지원</h1><p class="lead">사본 만들기 도움말</p><section><h2>어떤 파일을 열 수 있나요?</h2><p>파일에서 정지 이미지 JPEG 또는 PNG를 선택하세요. 검증에 실패하면 사본을 만들지 않습니다.</p></section><section><h2>어떤 정보가 제거되나요?</h2><p>JPEG의 EXIF·XMP 블록과 PNG의 eXIf·텍스트 청크를 제거합니다. 필요한 경우 표시 방향 태그만 남깁니다. 그 밖의 메타데이터와 사진 자체에 보이는 정보는 남을 수 있습니다.</p></section><p><a href="mailto:june1012june@gmail.com">문의하기</a></p></main>
