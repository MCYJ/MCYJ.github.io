    <h1>개인정보</h1>
    <p>Tank Record는 수조 이름, 측정값과 관리 메모를 사용자의 기기에 저장합니다. 앱에는 계정, 광고, 분석 도구 및 전용 서버가 없습니다.</p>
    <p>CSV를 내보낼 때에는 운영체제 공유 화면에서 저장 위치나 전달 대상을 선택합니다. 기기 백업은 운영체제 설정을 따릅니다. 앱을 제거하면 기기 안의 앱 기록이 삭제됩니다. 이미 내보낸 복사본은 저장한 위치에 남습니다.</p><p><a href="../">Tank Record</a> · <a href="../support/">지원</a></p>
  </main>
