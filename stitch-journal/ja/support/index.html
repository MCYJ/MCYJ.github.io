<main><h1>編み物日誌 · サポート</h1>
<p>作品を作成し、編み終えた段や目を「+1」で数えます。数え間違えたときは「元に戻す」や「やり直す」で訂正できます。編むのを中断するときは、続きの位置をメモしておくと、次に開いたときに段数と目数を確認できます。</p>
<p>最初の作品は無料です。一度購入すると作品を追加できます。すでに購入した場合は、購入時と同じApple Accountで「購入を復元」をお試しください。</p>
<p>問題を報告する際は、アプリとiOSのバージョン、問題が起きるまでの操作をお知らせください。</p>
<p><a href="mailto:june1012june@gmail.com">RushLabsへのお問い合わせ</a></p></main>
